<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#12121e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c896"/>
      <stop offset="100%" style="stop-color:#00f5c4"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="60%" style="stop-color:#e2e8f0"/>
      <stop offset="100%" style="stop-color:#94a3b8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="iconClip">
      <rect x="10" y="10" width="120" height="140" rx="28"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="500" height="160" rx="24" fill="url(#bgGrad)"/>

  <!-- Subtle background glow blob -->
  <ellipse cx="80" cy="80" rx="90" ry="70" fill="#6366f1" opacity="0.06"/>
  <ellipse cx="200" cy="60" rx="60" ry="40" fill="#00c896" opacity="0.04"/>

  <!-- Icon container -->
  <rect x="18" y="18" width="110" height="124" rx="24" fill="#0f0f1a"/>
  <rect x="18" y="18" width="110" height="124" rx="24" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.4"/>

  <!-- Sparkline chart inside icon -->
  <!-- Area fill under curve -->
  <g clip-path="url(#iconClip)">
    <path d="M28,118 L38,95 L55,105 L68,72 L82,82 L95,55 L110,65 L118,80 L118,135 L28,135 Z"
          fill="url(#greenGrad)" opacity="0.08"/>
    <!-- Chart line -->
    <polyline points="28,108 38,88 55,98 68,65 82,75 95,48 110,60"
              fill="none" stroke="url(#greenGrad)" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"
              filter="url(#softGlow)"/>
    <!-- Peak dot with pulse ring -->
    <circle cx="95" cy="48" r="10" fill="#00c896" opacity="0.15"/>
    <circle cx="95" cy="48" r="5" fill="#00f5c4" filter="url(#softGlow)"/>
    <circle cx="95" cy="48" r="3" fill="white"/>
  </g>

  <!-- Dollar sign accent at bottom of icon -->
  <text x="73" y="132" font-family="'SF Pro Display', 'Helvetica Neue', sans-serif"
        font-size="13" font-weight="700" fill="#6366f1" opacity="0.6"
        text-anchor="middle" letter-spacing="1">FMG</text>

  <!-- Main title -->
  <text x="152" y="80" font-family="'SF Pro Display', 'Helvetica Neue', 'Segoe UI', sans-serif"
        font-size="46" font-weight="800" letter-spacing="-2.5"
        fill="url(#textGrad)">Finance</text>

  <!-- "Tracker" with accent color -->
  <text x="154" y="122" font-family="'SF Pro Display', 'Helvetica Neue', 'Segoe UI', sans-serif"
        font-size="28" font-weight="300" letter-spacing="8"
        fill="url(#greenGrad)" filter="url(#softGlow)">TRACKER</text>

  <!-- Decorative purple dot accent -->
  <circle cx="148" cy="96" r="3" fill="url(#blueGrad)" opacity="0.8"/>

  <!-- Tagline -->
  <text x="154" y="148" font-family="'SF Pro Display', 'Helvetica Neue', sans-serif"
        font-size="11" font-weight="400" letter-spacing="2"
        fill="#475569">SMART MONEY. CLEAR FUTURE.</text>

</svg>
